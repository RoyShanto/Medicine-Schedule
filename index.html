<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="favicon.png" type="image/x-icon">
    <title>Medicine Manager</title>
    <!-- <script src="https://cdn.tailwindcss.com"></script> -->
    <link rel="stylesheet" href="output.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
</head>

<body class="bg-blue-50 min-h-screen flex items-center justify-center p-4 sm:p-8">

    <div class="w-full max-w-xl sm:max-w-5xl">
        <div class="flex items-center justify-between mb-5">
            <div></div>
            <h1 class="text-2xl sm:text-3xl font-bold text-center text-blue-700 "> My Medicine Schedule </h1>
            <button onclick="refreshApp()"> <span class="text-4xl">🔄</span> </button>
        </div>
        <div id="medicineList" class="overflow-x-auto mb-6  bg-white shadow-lg rounded-3xl p-4 sm:p-8"></div>
        <div id="othersSection" class="overflow-x-auto mb-6  bg-white shadow-lg rounded-3xl p-4 sm:p-8"></div>
        <div id="timeButtons" class="flex justify-between gap-3"></div>
    </div>

    <!-- Modal -->
    <div id="noteModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50 p-4">
        <div
            class="bg-white rounded-3xl shadow-xl w-full max-w-md p-4 sm:p-6 relative transform scale-95 transition-transform duration-200">
            <h3 class="text-xl sm:text-2xl font-bold mb-4 text-blue-700">Note</h3>
            <p id="noteContent" class="text-gray-700 mb-6 sm:text-base whitespace-pre-line"></p>
            <button onclick="closeModal()"
                class="absolute top-3 right-3 text-gray-500 hover:text-gray-800 font-bold text-2xl">&times;</button>
            <button onclick="closeModal()"
                class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl w-full sm:w-auto">Close</button>
        </div>
    </div>


    <div class="hidden">
        bg-yellow-400 hover:bg-yellow-500
        bg-green-400 hover:bg-green-500
        bg-indigo-400 hover:bg-indigo-500
        bg-blue-600 bg-blue-700 hover:bg-blue-800
        bg-purple-600 bg-purple-700 hover:bg-purple-800
        text-blue-600 text-purple-600
    </div>


    <script type="module">
        import { medicines } from "./medicines.js";
        import { others } from "./medicines.js"

        // const times = ['morning', 'noon', 'night'], colors = { morning: 'yellow', noon: 'green', night: 'indigo' };

        const times = ['morning', 'noon', 'night'];

        const colors = {
            morning: "bg-yellow-400 hover:bg-yellow-500",
            noon: "bg-green-400 hover:bg-green-500",
            night: "bg-indigo-400 hover:bg-indigo-500"
        };

        const generateButtons = () => {
            const container = document.getElementById('timeButtons');
            container.innerHTML = '';
            times.forEach(t => {
                const btn = document.createElement('button');
                btn.innerText = t[0].toUpperCase() + t.slice(1);
                // btn.className = `time-btn flex-1 font-semibold py-2 rounded-xl transition text-sm sm:text-base bg-${colors[t]}-400 hover:bg-${colors[t]}-500 text-white`;
                btn.className = `time-btn flex-1 font-semibold py-2 rounded-xl transition text-sm sm:text-base text-white ${colors[t]}`;
                btn.onclick = () => { showMedicine(t); setActiveButton(btn); };
                container.appendChild(btn);
            });
        };

        const setActiveButton = btn => {
            document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('ring-4', 'ring-offset-2', 'ring-blue-500', 'opacity-90'));
            btn.classList.add('ring-4', 'ring-offset-2', 'ring-blue-500', 'opacity-90');
        };

        const tableColors = {
            blue: {
                title: "text-blue-600",
                head: "bg-blue-600",
                note: "bg-blue-700 hover:bg-blue-800"
            },
            purple: {
                title: "text-purple-600",
                head: "bg-purple-600",
                note: "bg-purple-700 hover:bg-purple-800"
            }
        };

        const generateTable = (items, time, title, color, isMed = true) => {
            const headers = isMed ? ['S/N', 'Medicine', 'Dose', 'Food', 'Note'] : ['S/N', 'Item', 'Usage', 'Note'];
            const rows = items.length ? items.map((item, i) => {
                const dose = time === 'all' ? times.filter(t => item[t]).map(t => `${t[0].toUpperCase() + t.slice(1)}: ${item[t]}`).join(', ') :
                    `${isMed ? 'Take' : 'Use'} ${item[time]}${isMed ? '' : ' time(s)'}`;
                const food = isMed ? (item.afterFood ? 'After Food' : item.beforeFood ? 'Before Food' : '') : '';
                const foodCls = item.afterFood ? 'text-green-700 font-semibold' : item.beforeFood ? 'text-red-700 font-semibold' : '';
                const noteBtn = item.note ? `<button onclick="showNoteModal(\`${item.note}\`)" class="${tableColors[color].note} text-white px-3 py-1 rounded-xl text-xs sm:text-base cursor-pointer">Note</button>` : '-';
                return `<tr class="border-b hover:bg-gray-50 even:bg-gray-50 odd:bg-white">
                    <td class="py-2 px-2 sm:px-4 font-semibold">${i + 1}</td>
                    <td class="py-2 px-2 sm:px-4 font-semibold">${item.name}</td>
                    <td class="py-2 px-2 sm:px-4 sm:text-base">${dose}</td>
                    ${isMed ? `<td class="py-2 px-2 sm:px-4 ${foodCls} sm:text-base">${food}</td>` : ''}
                    <td class="py-2 px-2 sm:px-4">${noteBtn}</td>
                </tr>`;
            }).join('') : `<tr class="bg-gray-100"><td colspan="${headers.length}" class="py-4 px-2 text-center text-red-500 sm:text-base ">❌ No ${isMed ? 'medicines' : 'items'} for this time.</td></tr>`;

            return `<h2 class="text-xl sm:text-2xl font-semibold mb-3 ${tableColors[color].title}">${title}</h2>
                <div class="overflow-x-auto">
                    <table class="min-w-full bg-white rounded-2xl overflow-hidden shadow-lg text-sm sm:text-base">
                        <thead class="${tableColors[color].head} text-white text-sm sm:text-base"><tr>${headers.map(h => `<th class="py-2 px-2 sm:px-4 text-left">${h}</th>`).join('')}</tr></thead>
                        <tbody class="text-gray-700">${rows}</tbody>
                    </table>
                </div>`;
        };

        window.showMedicine = (time = 'all') => {
            document.getElementById('medicineList').innerHTML = generateTable(medicines.filter(m => time === 'all' || m[time]), time, 'Medicines', 'blue', true);
            document.getElementById('othersSection').innerHTML = generateTable(others.filter(o => time === 'all' || o[time]), time, 'External Items', 'purple', false);
        };

        window.showNoteModal = note => {
            document.getElementById('noteContent').innerText = note.split(',').map(s => s.trim()).join('\n');
            const modal = document.getElementById('noteModal'), c = modal.firstElementChild;
            modal.classList.remove('hidden'); c.classList.remove('scale-100'); c.classList.add('scale-95'); setTimeout(() => c.classList.add('scale-100'), 10);
        };

        window.closeModal = () => document.getElementById('noteModal').classList.add('hidden');

        generateButtons();
        window.onload = () => showMedicine('all');
        window.refreshApp = () => showMedicine('all');


        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/Medicine-Schedule/service-worker.js').then(reg => {
                reg.addEventListener('updatefound', () => {
                    const newWorker = reg.installing;
                    newWorker.addEventListener('statechange', () => {
                        if (newWorker.state === 'activated') {
                            location.reload(); // reload page automatically
                        }
                    });
                });
            });
        }

    </script>

</body>

</html>
